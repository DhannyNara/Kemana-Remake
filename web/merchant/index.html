
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Kemana Merchant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.webmanifest">
    <style>
        body { 
            font-family: sans-serif; 
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
    </style>
</head>
<body class="bg-gray-100">

    <div class="w-full max-w-md bg-white p-8 rounded-lg shadow-md">
        <h1 class="text-3xl font-bold text-center text-orange-500 mb-2">Kemana Merchant</h1>
        <p class="text-center text-gray-600 mb-8">Silakan login ke akun Anda</p>

        <form action="owner_dashboard.html" method="GET"> <!-- Arahkan ke dasbor owner untuk demonstrasi -->
            <div class="mb-4">
                <label for="email" class="block text-sm font-medium text-gray-700">Email atau Username</label>
                <input type="text" id="email" name="email" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-orange-500 focus:border-orange-500" placeholder="contoh: manager@resto.com" required>
            </div>

            <div class="mb-6">
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="password" name="password" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-orange-500 focus:border-orange-500" placeholder="********" required>
            </div>

            <div class="mb-6">
                <label for="role" class="block text-sm font-medium text-gray-700">Login sebagai</label>
                <select id="role" name="role" class="mt-1 block w-full px-3 py-2 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-orange-500 focus:border-orange-500">
                    <option value="owner">Owner</option>
                    <option value="manager">Manager</option>
                    <option value="kitchen">Kitchen</option>
                    <option value="cashier_pos">Cashier (POS)</option>
                </select>
            </div>

            <div>
                <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-orange-500 hover:bg-orange-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-orange-500">
                    Login
                </button>
            </div>
        </form>
    </div>

    <script>
        // Registrasi Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js');
            });
        }
    </script>
</body>
</html>
