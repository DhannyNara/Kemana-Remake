
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS - Kemana Merchant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.webmanifest">
    <style>
        body { font-family: sans-serif; }
        .main-container { height: 100vh; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 1rem; }
        .cart-items { height: calc(100vh - 250px); /* Adjust height based on surrounding elements */ }
    </style>
</head>
<body class="bg-gray-200">

    <div class="main-container flex">

        <!-- Product Selection (Left Side) -->
        <div class="w-3/5 bg-white p-4 flex flex-col">
            <header class="mb-4">
                <h1 class="text-3xl font-bold">Point of Sale</h1>
                <p class="text-gray-500">Resto Padang</p>
            </header>
            <div class="product-grid overflow-y-auto">
                <!-- Product 1 -->
                <div class="border rounded-lg p-3 text-center cursor-pointer hover:bg-indigo-50 hover:border-indigo-400">
                    <img src="https://via.placeholder.com/100" alt="Rendang" class="mx-auto mb-2 rounded">
                    <p class="font-semibold">Rendang</p>
                    <p class="text-sm text-gray-600">Rp 25,000</p>
                </div>
                <!-- Product 2 -->
                <div class="border rounded-lg p-3 text-center cursor-pointer hover:bg-indigo-50 hover:border-indigo-400">
                    <img src="https://via.placeholder.com/100" alt="Ayam Bakar" class="mx-auto mb-2 rounded">
                    <p class="font-semibold">Ayam Bakar</p>
                    <p class="text-sm text-gray-600">Rp 20,000</p>
                </div>
                <!-- Product 3 -->
                <div class="border rounded-lg p-3 text-center cursor-pointer hover:bg-indigo-50 hover:border-indigo-400">
                    <img src="https://via.placeholder.com/100" alt="Teh Tawar" class="mx-auto mb-2 rounded">
                    <p class="font-semibold">Teh Tawar</p>
                    <p class="text-sm text-gray-600">Rp 5,000</p>
                </div>
                 <!-- Add more products as needed -->
            </div>
        </div>

        <!-- Cart (Right Side) -->
        <div class="w-2/5 bg-gray-100 p-4 flex flex-col justify-between">
            <div>
                <h2 class="text-2xl font-bold mb-4 border-b pb-2">Keranjang</h2>
                <div class="cart-items overflow-y-auto space-y-3">
                    <!-- Cart Item 1 -->
                    <div class="flex justify-between items-center">
                        <div>
                            <p class="font-semibold">Rendang</p>
                            <p class="text-sm text-gray-500">Rp 25,000</p>
                        </div>
                        <div class="flex items-center space-x-3">
                            <input type="number" value="2" class="w-16 text-center border rounded">
                            <button class="text-red-500 hover:text-red-700">x</button>
                        </div>
                    </div>
                     <!-- Cart Item 2 -->
                    <div class="flex justify-between items-center">
                        <div>
                            <p class="font-semibold">Teh Tawar</p>
                            <p class="text-sm text-gray-500">Rp 5,000</p>
                        </div>
                        <div class="flex items-center space-x-3">
                            <input type="number" value="1" class="w-16 text-center border rounded">
                            <button class="text-red-500 hover:text-red-700">x</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="border-t pt-4">
                <div class="space-y-2 mb-4">
                    <div class="flex justify-between font-medium">
                        <p>Subtotal</p>
                        <p>Rp 55,000</p>
                    </div>
                    <div class="flex justify-between font-medium">
                        <p>Pajak (10%)</p>
                        <p>Rp 5,500</p>
                    </div>
                    <div class="flex justify-between text-2xl font-bold text-indigo-600">
                        <p>Total</p>
                        <p>Rp 60,500</p>
                    </div>
                </div>
                <button class="w-full bg-green-500 text-white font-bold py-4 rounded-lg text-lg hover:bg-green-600">Bayar Sekarang</button>
            </div>
        </div>

    </div>

</body>
</html>
