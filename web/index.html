
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kemana - Versi Web</title>

    <!-- Leaflet.js (Peta) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>

    <!-- Tailwind CSS (Styling) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Memberi tinggi pada div peta */
        #map { height: 60vh; }
        /* Mencegah sorotan biru saat di-tap di mobile */
        body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-gray-100 font-sans">

    <div class="max-w-lg mx-auto min-h-screen bg-white shadow-lg">

        <!-- Header -->
        <header class="bg-blue-600 text-white p-4 text-center shadow-md">
            <h1 class="text-2xl font-bold">Kemana</h1>
            <p class="text-sm">Pesan tumpangan, lebih cepat dan mudah.</p>
        </header>

        <!-- Div Peta -->
        <div id="map" class="w-full bg-gray-200"></div>

        <!-- Panel Kontrol -->
        <div id="control-panel" class="p-4 bg-white">

            <!-- Input Lokasi -->
            <div class="space-y-3 mb-4">
                <div class="relative">
                    <input id="from-input" type="text" placeholder="Titik jemput" class="w-full p-3 pl-10 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-blue-500">
                    <span class="absolute left-3 top-3 text-gray-400">📍</span>
                </div>
                <div class="relative">
                    <input id="to-input" type="text" placeholder="Tujuan" class="w-full p-3 pl-10 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-blue-500">
                    <span class="absolute left-3 top-3 text-gray-400">🏁</span>
                </div>
            </div>
            
            <!-- Tombol Pesan -->
            <button id="order-button" class="w-full bg-green-500 text-white font-bold p-4 rounded-lg shadow-lg hover:bg-green-600 transition-colors">
                Pesan Sekarang
            </button>

             <!-- Panel Status (muncul setelah memesan) -->
            <div id="status-panel" class="hidden mt-4 p-4 bg-blue-50 border border-blue-200 rounded-lg text-center">
                <p id="status-text" class="font-medium text-blue-800">Mencari driver terdekat...</p>
            </div>
        </div>
    </div>

    <script>
        // Inisialisasi Peta
        // Koordinat default (misal: Monas, Jakarta) jika lokasi tidak tersedia
        const map = L.map('map').setView([-6.175, 106.828], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let userMarker;

        // 1. Dapatkan Lokasi Pengguna
        function getUserLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;

                    // Pusatkan peta ke lokasi pengguna
                    map.setView([lat, lng], 15);

                    // Tambahkan marker untuk lokasi pengguna
                    if (userMarker) {
                        userMarker.setLatLng([lat, lng]);
                    } else {
                        userMarker = L.marker([lat, lng]).addTo(map);
                    }
                    userMarker.bindPopup("<b>Lokasi Anda</b>").openPopup();

                    // Secara otomatis isi input "Titik jemput"
                    document.getElementById('from-input').value = `Lokasi Saat Ini (${lat.toFixed(4)}, ${lng.toFixed(4)})`;

                }, () => {
                    alert('Gagal mendapatkan lokasi. Pastikan Anda mengizinkan akses lokasi.');
                });
            } else {
                alert("Geolocation tidak didukung oleh browser ini.");
            }
        }

        // 2. Fungsi untuk Mengirim Pesanan
        async function createOrder() {
            const from = document.getElementById('from-input').value;
            const to = document.getElementById('to-input').value;

            if (!from || !to) {
                alert('Harap isi titik jemput dan tujuan.');
                return;
            }

            // Tampilkan panel status
            const statusPanel = document.getElementById('status-panel');
            const statusText = document.getElementById('status-text');
            const orderButton = document.getElementById('order-button');

            statusText.textContent = 'Mengirim pesanan...';
            statusPanel.classList.remove('hidden');
            orderButton.disabled = true;
            orderButton.classList.add('opacity-50');

            // Siapkan data untuk dikirim ke backend
            const formData = new FormData();
            formData.append('asal', from);
            formData.append('tujuan', to);
            // Tarif bisa dihitung di backend atau client
            formData.append('tarif', Math.floor(Math.random() * 20000) + 10000); 

            try {
                // Kirim request ke API backend
                const response = await fetch('../api/buatOrder.php', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const result = await response.json();
                    statusText.textContent = result.message || 'Pesanan berhasil! Menunggu konfirmasi driver.';
                    statusPanel.className = 'mt-4 p-4 bg-green-50 border border-green-200 rounded-lg text-center'; // Ubah warna jadi hijau
                } else {
                    const error = await response.text();
                    throw new Error(error);
                }

            } catch (error) {
                console.error('Gagal membuat pesanan:', error);
                statusText.textContent = 'Gagal membuat pesanan. Coba lagi.';
                statusPanel.className = 'mt-4 p-4 bg-red-50 border border-red-200 rounded-lg text-center'; // Ubah warna jadi merah
                
                // Aktifkan kembali tombol setelah beberapa saat
                setTimeout(() => {
                     orderButton.disabled = false;
                     orderButton.classList.remove('opacity-50');
                     statusPanel.classList.add('hidden');
                }, 3000);
            }
        }

        // Event Listeners
        document.addEventListener('DOMContentLoaded', getUserLocation);
        document.getElementById('order-button').addEventListener('click', createOrder);

    </script>
</body>
</html>
